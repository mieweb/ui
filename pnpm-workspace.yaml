# pnpm v10 reads overrides and peerDependencyRules from here instead of the
# package.json "pnpm" field. See https://pnpm.io/settings
# Keep packages empty so the git-submodule packages (esheet/ychart) are not
# pulled in as workspace members — this stays a single-package install.
packages: []

overrides:
  datavis-ace: "=4.1.0"
  "esbuild@<0.28.1": "0.28.1"
  "axios@>=1.0.0 <1.16.0": "1.16.0"
  "minimatch@>=10.0.0 <10.2.3": "10.2.3"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "flatted@<3.4.2": "3.4.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "uuid@<11.1.1": "11.1.1"
  "dompurify@<3.4.0": "3.4.0"

patchedDependencies:
  # kerebron regression hit by the storybook a11y CI job: the code-block
  # language <select> has no accessible name (axe select-name). Drop once
  # fixed upstream. (The 0.8.9 "Illegal invocation" getSelection patch was
  # fixed upstream in 0.8.12.)
  "@kerebron/extension-codecrock@0.8.12": patches/@kerebron__extension-codecrock@0.8.12.patch
  # Ported from packages/esheet (same patch, field-tested there):
  # 1. Toolbar dropdown items re-dispatch their command via a synthetic
  #    MouseEvent built with `view: dntShim.dntGlobalThis` — dnt's merge-proxy
  #    is not a real Window, so the event throws and the command never runs
  #    (heading/list pickers were dead). Use the editor document's real window.
  # 2. Toolbar buttons never reflected state: measurement-pass renders dropped
  #    the `update` callback and `update()` re-rendered into the void; also
  #    adds missing `active` callbacks so bold/italic/alignment show pressed.
  "@kerebron/extension-menu@0.8.12": patches/@kerebron__extension-menu@0.8.12.patch

peerDependencyRules:
  # @mieweb/datavis bundles a published @mieweb/ui dev snapshot whose peer pins
  # an older datavis; allow the version this repo actually depends on.
  allowedVersions:
    "@mieweb/ui>@mieweb/datavis": "1.7.0"

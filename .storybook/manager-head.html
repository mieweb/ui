<!--
  Dark-mode styling for controls (boolean toggles etc.) is handled by the
  dynamic theme CSS injected in manager.ts (injectBrandCSS), which keys off
  the Storybook theme global. Do not add prefers-color-scheme overrides here:
  they follow the OS theme and clash with the in-app light/dark toggle.
-->
<!--
  iOS-only viewport patch: iOS Safari auto-zooms the page when focusing an
  input with a font-size < 16px — including inputs inside the cross-origin
  Ozwell widget iframe below, whose pinned @mieweb/ui (0.9.0) predates the
  composer 16px font floor. The zoom shoves the chat panel off-screen on
  phones. maximum-scale=1 suppresses that auto-zoom, and on iOS it is
  harmless for accessibility: pinch-zoom has ignored maximum-scale since
  iOS 10. It is injected ONLY on iOS because Android browsers honor
  maximum-scale and would lose pinch-zoom (WCAG 1.4.4) — and Android never
  auto-zooms on focus, so it needs no shield. Appended after Storybook's
  default viewport meta, so it wins (last parsed). Interim until
  mieweb/ozwellai-api#298 ships.
-->
<script>
  (function () {
    var isIOS =
      /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      // iPadOS 13+ reports as Macintosh; real Macs have no touch points.
      (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    if (!isIOS) return;
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, initial-scale=1, maximum-scale=1';
    document.head.appendChild(meta);
  })();
</script>
<!--
  Ozwell assistant embed (hosted CDN widget from mieweb/ozwellai-api).
  Lives in the manager shell so it floats over the whole Storybook without
  polluting story canvases, visual snapshots, or the test-runner (which load
  iframe.html directly and never execute manager scripts).

  The widget only mounts when an agent key is available:
    - production: set OZWELL_AGENT_KEY below to the site-approved agent key
      (agnt_key-..., created in Ozwell Manager; safe to embed client-side)
    - local dev:  localStorage.setItem('ozwellAgentKey', 'agnt_key-...') and reload

  The assistant is catalog-aware via page tools answered from Storybook's
  static ./index.json (every section, component, and story in this build)
  and from ./ozwell/docs.json, a usage-docs corpus generated at build time
  by scripts/build-ozwell-docs.mjs (stories docs metadata, component JSDoc,
  and the src/catalog selection guidance):
    - list_components         -> all components grouped by section, with counts
    - get_component_stories   -> the stories (variants) of one component
    - get_component_docs      -> usage docs: what it is, examples, when to use
    - open_story              -> navigate this Storybook to a story/docs page
-->
<script>
  (function () {
    var OZWELL_AGENT_KEY = 'agnt_key-muncblarc362ef130f8eae23'; // site agent key for ui.mieweb.org
    var key = OZWELL_AGENT_KEY || window.localStorage.getItem('ozwellAgentKey');
    if (!key) return;

    // ---- Catalog lookups backed by Storybook's static index.json ----
    var indexPromise = null;
    function loadIndex() {
      if (!indexPromise) {
        indexPromise = fetch('./index.json').then(function (r) {
          if (!r.ok) throw new Error('index.json HTTP ' + r.status);
          return r.json();
        });
      }
      return indexPromise;
    }

    // Docs corpus generated by scripts/build-ozwell-docs.mjs (catalog MDX
    // guidance + component JSDoc/@example), fetched once and cached.
    var docsPromise = null;
    function loadDocs() {
      if (!docsPromise) {
        docsPromise = fetch('./ozwell/docs.json').then(function (r) {
          if (!r.ok) throw new Error('docs.json HTTP ' + r.status);
          return r.json();
        });
      }
      return docsPromise;
    }

    // Group entries by title: { 'Actions/Button': { docsId, stories: [{id, name}] } }
    function componentsFrom(entries) {
      var byTitle = {};
      Object.keys(entries).forEach(function (id) {
        var e = entries[id];
        var c = byTitle[e.title] || (byTitle[e.title] = { docsId: null, stories: [] });
        if (e.type === 'docs') c.docsId = e.id;
        else c.stories.push({ id: e.id, name: e.name });
      });
      return byTitle;
    }

    window.OzwellChatConfig = {
      apiKey: key,
      tools: [
        {
          type: 'function',
          function: {
            name: 'list_components',
            description:
              'List everything in this Storybook: every component and docs page grouped by section, each with its story (variant) count.',
            parameters: { type: 'object', properties: {}, required: [] },
          },
        },
        {
          type: 'function',
          function: {
            name: 'get_component_stories',
            description:
              'Get the stories (variants) of one component by name, e.g. "Button" or "Actions/Button". Returns each story name and its id.',
            parameters: {
              type: 'object',
              properties: {
                component: { type: 'string', description: 'Component name or full section/title' },
              },
              required: ['component'],
            },
          },
        },
        {
          type: 'function',
          function: {
            name: 'get_component_docs',
            description:
              'Get usage documentation for one component by name, e.g. "Button": what it is, code examples, and guidance on when to use it versus related components. Always call this before answering "how do I use…" questions.',
            parameters: {
              type: 'object',
              properties: {
                component: { type: 'string', description: 'Component name, e.g. "Button"' },
              },
              required: ['component'],
            },
          },
        },
        {
          type: 'function',
          function: {
            name: 'open_story',
            description:
              'Navigate this Storybook to a story or docs page by id from get_component_stories (e.g. "actions-button--danger"). Warn the user first: navigation reloads the page and ends this chat conversation.',
            parameters: {
              type: 'object',
              properties: { id: { type: 'string', description: 'Story or docs id' } },
              required: ['id'],
            },
          },
        },
      ],
    };

    document.addEventListener('ozwell-tool-call', function (e) {
      var name = e.detail.name;
      var args = e.detail.arguments || {};
      var respond = e.detail.respond;
      var fail = function (err) {
        respond({ isError: true, error: String((err && err.message) || err) });
      };

      loadIndex()
        .then(function (idx) {
          var comps = componentsFrom(idx.entries);

          if (name === 'list_components') {
            var sections = {};
            Object.keys(comps).forEach(function (title) {
              var parts = title.split('/');
              var section = parts.length > 1 ? parts[0] : 'Other';
              var label = parts.slice(1).join('/') || parts[0];
              (sections[section] = sections[section] || []).push(
                label + ' (' + comps[title].stories.length + ' stories)'
              );
            });
            respond({ success: true, sections: sections });
          } else if (name === 'get_component_stories') {
            var q = String(args.component || '').toLowerCase();
            var matches = Object.keys(comps).filter(function (title) {
              var t = title.toLowerCase();
              return t === q || t.endsWith('/' + q) || t.split('/').pop() === q;
            });
            if (!matches.length) {
              matches = Object.keys(comps).filter(function (title) {
                return title.toLowerCase().indexOf(q) !== -1;
              });
            }
            if (!matches.length) {
              respond({ isError: true, error: 'No component matching "' + args.component + '"' });
            } else if (matches.length > 1) {
              respond({ success: true, multipleMatches: matches });
            } else {
              var c = comps[matches[0]];
              respond({
                success: true,
                component: matches[0],
                storyCount: c.stories.length,
                stories: c.stories,
                docsId: c.docsId,
              });
            }
          } else if (name === 'get_component_docs') {
            loadDocs()
              .then(function (docs) {
                // Normalize so 'EsheetRenderer' matches the 'ESheet Renderer'
                // title segment and casing/punctuation never miss.
                var norm = function (s) {
                  return String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
                };
                var want = norm(args.component || '');
                var titles = Object.keys(docs.stories);
                // Story titles carry the canonical name and the export
                // mapping (e.g. 'ReconciliationPanel' -> AIReconciliationPanel).
                // A title-segment match outranks a component-export match:
                // several demo stories can share one meta component.
                var storyTitle =
                  titles.filter(function (t) {
                    return norm(t.split('/').pop()) === want;
                  })[0] ||
                  titles.filter(function (t) {
                    var c = docs.stories[t].component;
                    return c && norm(c) === want;
                  })[0];
                var storyDoc = storyTitle && docs.stories[storyTitle];
                var compName =
                  Object.keys(docs.components).filter(function (n) {
                    return norm(n) === want;
                  })[0] || (storyDoc && storyDoc.component);
                var jsdoc = compName && docs.components[compName];
                // Canonical index title gives the docs page id + category.
                var title =
                  storyTitle && comps[storyTitle]
                    ? storyTitle
                    : Object.keys(comps).filter(function (t) {
                        return norm(t.split('/').pop()) === want;
                      })[0];
                var category = title && title.split('/').slice(0, -1).join('/');
                var guidance = category && docs.categories[category];
                if (!storyDoc && !jsdoc && !guidance) {
                  return respond({
                    isError: true,
                    error: 'No docs for "' + args.component + '"',
                  });
                }
                respond({
                  success: true,
                  component: (storyDoc && storyDoc.component) || compName || args.component,
                  // Stories docs metadata is this repo's canonical usage
                  // guidance; implementation JSDoc is the fallback.
                  description:
                    (storyDoc && storyDoc.description) || (jsdoc && jsdoc.description) || null,
                  examples: jsdoc ? jsdoc.examples : [],
                  category: category || null,
                  categoryGuidance: guidance ? guidance.content : null,
                  docsPageId: title && comps[title] ? comps[title].docsId : null,
                });
              })
              .catch(fail);
          } else if (name === 'open_story') {
            var entry = idx.entries[String(args.id || '')];
            if (!entry) return respond({ isError: true, error: 'No story with id "' + args.id + '"' });
            var path = '/' + (entry.type === 'docs' ? 'docs' : 'story') + '/' + entry.id;
            respond({ success: true, opening: entry.title + ' — ' + entry.name });
            // Full navigation: the manager router is not reachable from a plain
            // script, so this reloads the page (and restarts the chat).
            setTimeout(function () {
              window.location.href = './?path=' + path;
            }, 400);
          } else {
            respond({ isError: true, error: 'Unknown tool: ' + name });
          }
        })
        .catch(fail);
    });

    var script = document.createElement('script');
    script.src = 'https://ozwellapi.os.mieweb.org/widget';
    script.async = true;
    document.head.appendChild(script);

    // Temporary launcher icon fix (remove when mieweb/ozwellai-api#296
    // ships): the loader hardcodes the launcher image to the host page's
    // /favicon.ico, which this site doesn't serve — so the button renders a
    // broken image. Swap in the Ozwell mark this Storybook already serves
    // for HeyOzwell. Polled rather than observed because the loader
    // re-renders the button's innerHTML on panel toggles, restoring the
    // broken favicon after any one-shot swap.
    setInterval(function () {
      var img = document.querySelector('#ozwell-chat-button img');
      if (img && img.getAttribute('src') !== './ozwell/icon.svg') {
        img.src = './ozwell/icon.svg';
        // Fill the 60px circle: the loader caps .ozwell-chat-icon at 32px
        // and pads the button. Inline styles win and are re-applied with
        // the src whenever the loader re-renders the button.
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';
        img.parentElement.style.padding = '0';
        img.parentElement.style.background = '#fff';
      }
    }, 500);
  })();
</script>

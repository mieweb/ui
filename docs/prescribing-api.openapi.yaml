    "description": "Application contract for replaceable EHR services. Simulator contains invented drugs and patients; it does not provide clinical guidance, DEA EPCS certification, NCPDP/FHIR conformance, or real transmission. Production EHR supplies trusted session context, maintained knowledge sources, licensed NCPDP profiles, provider credentials, transport and durable audit. See docs/prescribing-api.md and prescribe-plan.md for applicable standards."

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels that PR's run still in progress: only the latest
# commit's result matters. Pushes to main/develop group by SHA and never cancel,
# so every merged commit keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for all jobs (override per-job as needed).
permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Lint
        run: pnpm lint

      - name: RTL guard (no new physical-direction classes)
        run: pnpm rtl:scan

      - name: Catalog guard (taxonomy, tags, ids, descriptions, relationships)
        run: pnpm catalog:check

      - name: Agent evals guard (entry format, agent names, source citations)
        run: pnpm agent:evals

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format

  unit-tests:
    name: Unit Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One run: the coverage run executes the same suite and fails on any
      # failing test, so a separate plain `pnpm test` only repeated it.
      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov
        # Coverage remains available above if Codecov's download/upload fails.
        # Unit test and coverage generation failures still fail this job.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: unit-tests-coverage

  # The suite (377 tests, ~10.5 minutes on one runner) is split across three
  # runners, each keeping playwright.config.ts's single CI worker. More
  # workers per runner was tried: on 4 vCPUs, 2 and 4 workers slowed the
  # EncounterVisit editor past its 5 s waits and those tests flaked.
  visual-tests-shard:
    name: Visual Regression Tests (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Pinned: ubuntu-latest moved to 26.04 (2026-10), which Playwright 1.58
    # cannot install browsers on. Unpin after upgrading @playwright/test to
    # >=1.61 and regenerating the visual baselines its new Chromium shifts.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          # CodeLookup's .mcdx index shards (.storybook/public/codify) live in
          # git LFS; without them the offline index never reaches "ready" and
          # the CodeLookup visual tests time out.
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      # No `pnpm build` here: Storybook compiles the components from src/
      # (.storybook/main.ts aliases @mieweb/ui/* there) and the tests only
      # load storybook-static/. Build Test covers the package build.
      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Run Playwright tests
        run: pnpm test:visual --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          # playwright.config.ts: html report -> playwright-report/,
          # outputDir (failure screenshots, diffs, traces) -> playwright-results/
          path: |
            playwright-report/
            playwright-results/
          retention-days: 30

  # "Visual Regression Tests" is a required status check on main. This job
  # keeps that name and passes only when every shard passed.
  visual-tests:
    name: Visual Regression Tests
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: visual-tests-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check all shards passed
        run: test "${{ needs.visual-tests-shard.result }}" = success

  build-test:
    name: Build Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Build package
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Check @mieweb/ui/templates is Server Component safe
        run: pnpm check:templates-rsc

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            storybook-static/

  # The suite (~280 story files, ~12 minutes in one job) is split across three
  # runners. Each keeps test:storybook's --maxWorkers 2, which stabilised the
  # full run; sharding adds machines instead of crowding one.
  accessibility-tests-shard:
    name: Accessibility Tests (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Pinned: see visual-tests — Playwright 1.58 cannot install browsers on
    # the Ubuntu 26.04 image ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      # No `pnpm build` here: Storybook compiles the components from src/
      # (.storybook/main.ts aliases @mieweb/ui/* there) and the tests only
      # load storybook-static/. Build Test covers the package build.
      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Start Storybook server
        # pnpm exec uses the pinned devDependency — pnpm dlx downloads from
        # the npm registry at run time and times out during registry outages.
        run: pnpm exec http-server storybook-static --port 6006 --silent &

      - name: Wait for Storybook
        run: pnpm exec wait-on http://localhost:6006

      - name: Run Storybook tests
        run: pnpm test:storybook --shard=${{ matrix.shard }}/3

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report-${{ matrix.shard }}
          path: |
            test-results/
            coverage/

  # "Accessibility Tests" is a required status check on main. This job keeps
  # that name and passes only when every shard passed.
  accessibility-tests:
    name: Accessibility Tests
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: accessibility-tests-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check all shards passed
        run: test "${{ needs.accessibility-tests-shard.result }}" = success

  security-audit:
    name: Security Audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Run security audit
        # The npm audit endpoint has intermittent outages (ERR_SOCKET_TIMEOUT).
        # Treat registry connectivity failures as a warning instead of failing
        # the build; real vulnerability findings still fail.
        run: |
          set +e
          output=$(pnpm audit --audit-level=high --prod 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -qE 'ERR_SOCKET_TIMEOUT|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|FetchError'; then
            echo "::warning::npm audit registry endpoint unreachable — skipping audit (network error, not a vulnerability finding)"
            exit 0
          fi
          exit $exit_code

      - name: Run dependency license check
        run: pnpm dlx license-checker --onlyAllow 'MIT;Apache-2.0;ISC;BSD;BSD-2-Clause;BSD-3-Clause;Apache;Unlicense'

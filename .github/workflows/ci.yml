name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default for all jobs (override per-job as needed).
permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Lint
        run: pnpm lint

      - name: RTL guard (no new physical-direction classes)
        run: pnpm rtl:scan

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: unit-tests-coverage

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Build package
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Run Playwright tests
        run: pnpm test:visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Build package
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            storybook-static/

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eSheet submodule
        run: pnpm build:esheet

      - name: Build package
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Start Storybook server
        # pnpm exec uses the pinned devDependency — pnpm dlx downloads from
        # the npm registry at run time and times out during registry outages.
        run: pnpm exec http-server storybook-static --port 6006 --silent &

      - name: Wait for Storybook
        run: pnpm exec wait-on http://localhost:6006

      - name: Run Storybook tests
        run: pnpm test:storybook

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: |
            test-results/
            coverage/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Run security audit
        # The npm audit endpoint has intermittent outages (ERR_SOCKET_TIMEOUT).
        # Treat registry connectivity failures as a warning instead of failing
        # the build; real vulnerability findings still fail.
        run: |
          set +e
          output=$(pnpm audit --audit-level=high --prod 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -qE 'ERR_SOCKET_TIMEOUT|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|FetchError'; then
            echo "::warning::npm audit registry endpoint unreachable — skipping audit (network error, not a vulnerability finding)"
            exit 0
          fi
          exit $exit_code

      - name: Run dependency license check
        run: pnpm dlx license-checker --onlyAllow 'MIT;Apache-2.0;ISC;BSD;BSD-2-Clause;BSD-3-Clause;Apache;Unlicense'